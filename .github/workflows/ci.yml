name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Token consistency, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Check generated design tokens
        run: pnpm tokens:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  database-tests:
    name: Supabase migrations and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase services
        run: supabase start -x studio,inbucket,edge-runtime,logflare,vector
      - name: Apply migrations from a clean database
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db --local
